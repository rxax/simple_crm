<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CRM</title>
    <style>
      :root {
        --background-color: #191919;
        --card-bg: #222;
        --input-bg: rgba(255, 255, 255, 0.05);
        --input-border: rgba(255, 255, 255, 0.1);
        --input-focus: #38bdf8;
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.7);
        --button-bg: #38bdf8;
        --button-hover: #0284c7;
        --error-color: #f472b6;
        --success-color: #4ade80;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
        background: linear-gradient(135deg, #0f0f0f 0%, #191919 50%, #1a1a2e 100%);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .login-container {
        width: 100%;
        max-width: 420px;
        animation: slideUp 0.6s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-card {
        background: var(--card-bg);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 3rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                    inset 0 1px rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
      }

      .login-header {
        text-align: center;
        margin-bottom: 2.5rem;
      }

      .login-header h1 {
        font-size: 2rem;
        font-weight: 800;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
        letter-spacing: -0.02em;
      }

      .login-header p {
        color: var(--text-secondary);
        font-size: 0.95rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-group label {
        display: block;
        color: var(--text-secondary);
        font-size: 0.9rem;
        font-weight: 500;
        margin-bottom: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .form-group input {
        width: 100%;
        padding: 0.875rem 1rem;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 1rem;
        font-family: inherit;
        transition: var(--transition);
      }

      .form-group input::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }

      .form-group input:focus {
        outline: none;
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--input-focus);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
      }

      .form-group input:hover:not(:focus) {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.15);
      }

      .form-group input[type="text"] {
        background: var(--input-bg) url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"><path d="M20 21l-4.35-4.35M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/></svg>') no-repeat right 1rem center;
        padding-right: 3rem;
      }

      .form-group input[type="password"] {
        background: var(--input-bg) url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>') no-repeat right 1rem center;
        padding-right: 3rem;
      }

      .messages {
        margin-bottom: 2rem;
        padding: 1rem;
        border-radius: 8px;
        border-left: 4px solid var(--error-color);
        background: rgba(244, 114, 182, 0.1);
        animation: slideDown 0.3s ease-out;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .messages ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .messages li {
        color: #fca5d5;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .messages li:not(:last-child) {
        margin-bottom: 0.5rem;
      }

      .submit-button {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, var(--button-bg) 0%, #0284c7 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
        transition: var(--transition);
        box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3),
                    inset 0 1px rgba(255, 255, 255, 0.1);
      }

      .submit-button:hover {
        background: linear-gradient(135deg, var(--button-hover) 0%, #1b4965 100%);
        box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4),
                    inset 0 1px rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }

      .submit-button:active {
        transform: translateY(0);
        box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3),
                    inset 0 1px rgba(0, 0, 0, 0.2);
      }

      .submit-button:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.5),
                    0 4px 15px rgba(56, 189, 248, 0.3);
      }

      @media (max-width: 640px) {
        .login-card {
          padding: 2rem;
        }

        .login-header h1 {
          font-size: 1.5rem;
        }

        .form-group input {
          padding: 0.75rem 0.875rem;
          font-size: 16px;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
          padding-right: 2.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <h1>Login</h1>
          <p>Access your CRM dashboard</p>
        </div>

        {% if messages %}
          <div class="messages">
            <ul>
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
            </ul>
          </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="form-group">
            <label for="username">Username</label>
            <input 
              type="text" 
              id="username"
              name="username" 
              placeholder="Enter your username"
              required
              autocomplete="username"
            >
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input 
              type="password" 
              id="password"
              name="password" 
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
          </div>

          <button type="submit" class="submit-button">Login</button>
        </form>

        <div style="text-align: center; margin-top: 1.25rem; color: rgba(255,255,255,0.7);">
          Need an account? <a href="{% url 'signup' %}" style="color: #7dd3fc; text-decoration: none;">Create one</a>
        </div>
      </div>
    </div>
  </body>
</html>
